/* ===== tokens.css ===== */
/* ============================================================
   FIBA 3x3 Nations League — tokens.css
   Single source of truth for colour, motion and layout values.
   Generated from design-system/*.html — edit here, not there.
   ============================================================ */

:root {

  /* Surfaces */
  --surface-page: #FFFFFF;
  --surface-raised: #FAFAFA;
  --surface-sunken: #F5F5F5;
  --surface-sunken-2: #E5E5E5;

  /* Borders */
  --border-subtle: #E5E5E5;
  --border-default: #D4D4D4;
  --border-strong: #A3A3A3;

  /* Text */
  --text-primary: #0A0A0A;
  --text-secondary: #525252;
  --text-muted: #737373;
  --text-disabled: #A3A3A3;
  --text-inverse: #FFFFFF;

  /* Actions */
  --action-default: #000000;
  --action-hover: #262626;
  --action-pressed: #404040;
  --action-disabled: #D4D4D4;
  --action-ghost-bg: #F5F5F5;

  /* Status */
  --status-live: #E30613;
  --status-qualified: #009A3E;
  --status-shortlisted: #F9B123;
  --status-neutral: #737373;

  /* Site chrome (dark bars) */
  --chrome-bg: #171717;
  --chrome-bg-2: #262626;
  --chrome-text: #FFFFFF;
  --chrome-text-muted: #A3A3A3;
  --chrome-line: #262626;
  --chrome-accent: #DBC068;
  --chrome-hover: #2E2E2E;

  /* Other */
  --brand-stroke: conic-gradient(from 180deg at 50% 50%,#253B97 10%,#0038FF 53%,#FCA800 79%,#ED0038 94%);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --cut-s: 8px;
  --cut-m: 12px;
  --cut-l: 16px;

  /* Motion — every transition in the system reads from these */
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --dur-slow: 360ms;
  --dur-page: 480ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  /* Layout */
  --content-max: 1440px;
  /* The page's own side gutter. Below 1440 + 2 x 120 it is the clamped
     viewport gutter; above it, the value that centres a 1440 column —
     240px at 1920. Percentages resolve against the element it is used
     on, so any full-bleed band padded with it lines up with .tpl-content. */
  --page-gutter: max(clamp(20px, 4vw, 120px), calc((100% - 1440px) / 2));
  --gutter: 240px;
}

/* ============================================================

* {

body {

b {

}
@property --c  { syntax: '<length>'; initial-value: 8px; inherits: true; }
@property --n  { syntax: '<length>'; initial-value: 1px; inherits: true; }
@property --ic { syntax: '<length>'; initial-value: 8px; inherits: true; }

.cut {
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));
}
.cut-l {
  --c:16px;
}
.cut-m {
  --c:12px;
}
.cut-out > *:not(.cutfill) {

}
.cut-out {
  --ic:calc(var(--c) - 0.586 * var(--n,1px));
}

}

.cutfill {
  position:absolute;
  left:0;
  top:0;
  right:0;

  clip-path:polygon(var(--ic) 0,100% 0,100% calc(100% - var(--ic)),calc(100% - var(--ic)) 100%,0 100%,0 var(--ic));
}
.cut-in {
  clip-path:polygon(var(--ic) 0,100% 0,100% calc(100% - var(--ic)),calc(100% - var(--ic)) 100%,0 100%,0 var(--ic));
}

/* Belt and braces: if @property is unavailable the fill still has to be a
   cut shape, so give it the outer radius rather than an invalid length. */
@supports not (background: paint(x)) {
  .cut-out { --ic: var(--c); }
}

.pcard {
  /* el-16 Card, verbatim: the 1px default outline and e1 at rest.
     The outline is the two-layer cut surface — the card itself is
     filled with --border-default and clipped, and the .cutfill child
     inset by 1px carries the card's own surface, so the line follows
     the 45 degree corner instead of being clipped away there.
     --ic is set here rather than through .cut-out, because that class
     also forces every child to position:relative and the card's four
     layers are absolutely positioned.
     Elevation is NOT on this element. clip-path is applied after
     filter, so a drop-shadow set here is clipped away with the
     corners — the shadow has to sit on an unclipped layer above,
     which is what .sh / .sh-e1 is for (Foundations > Elevation).
     The card ships wrapped in <div class="sh sh-e1 pcard-sh">. */
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  width:342px;
  aspect-ratio:1/1.4;
  overflow:hidden;
  --of:#E5E5E5;
  --n:1px;
  --ic:calc(var(--c) - 0.586px);
  border:1px solid transparent;
  background:var(--border-default);
  background-clip:border-box;
}
.pcard-sh {
  /* The shadow layer for E-08. inline-flex so it hugs the card in a
     block context and still behaves as a flex item inside E-10; the
     card keeps its own width, the wrapper only carries the shadow. */
  display:inline-flex;
  vertical-align:top;
  min-width:0;
  /* An explicit cross size stops a column flex parent from stretching
     the wrapper to full width; inside E-10 the flex-basis wins. */
  width:fit-content;
}
.pcard-sh > .pcard {
  flex:1 1 auto;
  min-width:0;
}

  position:absolute;
