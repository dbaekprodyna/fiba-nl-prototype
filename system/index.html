<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>FIBA 3x3 Nations League — Design System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/elements.css">
<link rel="stylesheet" href="../assets/modules.css">
<link rel="stylesheet" href="../assets/motion.css">
<link rel="stylesheet" href="../assets/interactions.css">
<link rel="stylesheet" href="../assets/behaviour.css">
<link rel="stylesheet" href="assets/docs.css">
<link rel="stylesheet" href="assets/shell.css">
</head>
<body class="shell">

<aside class="nav">
  <a class="nav-brand" href="#foundations">
    <img class="nav-logo" src="../assets/logo-nl.svg" alt="3x3 Nations League" width="81" height="18">
    <span class="nav-brand-txt">Design System</span>
  </a>

  <div class="nav-search">
    <input id="q" type="search" placeholder="Search…" autocomplete="off" aria-label="Search components">
  </div>

  <nav class="nav-tree" id="tree" aria-label="Components"></nav>

  <div class="nav-foot">
    <a href="../index.html">Prototype ↗</a>
    <span id="count"></span>
  </div>
</aside>

<main class="main" id="main">
  <header class="bar">
    <div class="bar-crumb" id="crumb"></div>
  </header>

  <section class="doc" id="doc" aria-live="polite">
    <div class="empty-state">
      <h1>Design system</h1>
      <p>Foundations, elements and modules for the FIBA 3x3 Nations League.
         Pick a group on the left; the menu inside it jumps to a component.</p>
      <p class="hint">Every block here runs on the same CSS as the prototype,
         so a change to a token or a component shows up in both.</p>
    </div>
  </section>
</main>

<script src="../assets/app.js" defer></script>
<script>
(function () {
  'use strict';
  var tree  = document.getElementById('tree');
  var doc   = document.getElementById('doc');
  var crumb = document.getElementById('crumb');
  var q     = document.getElementById('q');
  var NAV = [], cache = {}, current = '', spy = null;

  fetch('nav.json').then(function (r) { return r.json(); })
    .then(function (n) { NAV = n; render(); route(); })
    .catch(function () {
      doc.innerHTML = '<div class="empty-state"><h1>Could not load nav.json</h1>' +
        '<p>Open this through a web server, not by double-clicking the file.</p></div>';
    });

  function esc(s) {
    return s.replace(/[&<>]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c];
    });
  }

  function render(filter) {
    var f = (filter || '').trim().toLowerCase(), total = 0, html = '';
    NAV.forEach(function (g) {
      var items = g.items.filter(function (i) {
        return !f || (i.title + ' ' + i.desc).toLowerCase().indexOf(f) > -1;
      });
      total += items.length;
      if (!items.length) return;
      html += '<div class="grp" data-grp="' + g.id + '">' +
              '<a class="grp-h" href="#' + g.id + '">' + esc(g.name) +
              '<span>' + items.length + '</span></a>';
      items.forEach(function (i) {
        html += '<a class="grp-i" href="#' + g.id + '/' + i.slug + '" ' +
                'data-grp="' + g.id + '" data-slug="' + i.slug + '">' +
                esc(i.title) + '</a>';
      });
      html += '</div>';
    });
    tree.innerHTML = html || '<p class="grp-none">No match.</p>';
    document.getElementById('count').textContent = total + ' blocks';
    mark();
  }

  function parse() {
    var h = location.hash.slice(1).split('/');
    return { grp: h[0] || '', slug: h[1] || '' };
  }

  function group(id) {
    return NAV.filter(function (g) { return g.id === id; })[0];
  }

  function mark(activeSlug) {
    var p = parse(), slug = activeSlug || p.slug;
    [].forEach.call(tree.querySelectorAll('.grp'), function (el) {
      el.classList.toggle('open', el.dataset.grp === p.grp);
    });
    [].forEach.call(tree.querySelectorAll('.grp-i'), function (a) {
      a.classList.toggle('on', a.dataset.grp === p.grp && a.dataset.slug === slug);
    });
  }

  function route() {
    var p = parse();
    if (!p.grp) { mark(); return; }
    var g = group(p.grp);
    if (!g) return;
    crumb.textContent = g.name;

    if (current === p.grp) { jump(p.slug); mark(); return; }
    doc.innerHTML = '<div class="loading">Loading…</div>';
    var done = function (html) {
      current = p.grp;
      doc.innerHTML = '<div class="stage" id="stage">' + html + '</div>';
      if (window.FIBA) window.FIBA.init(doc);
      observe();
      jump(p.slug);
      mark();
    };
    if (cache[p.grp]) { done(cache[p.grp]); return; }
    fetch('pages/' + p.grp + '.html')
      .then(function (r) { return r.text(); })
      .then(function (html) { cache[p.grp] = html; done(html); });
  }

  function jump(slug) {
    if (!slug) { doc.scrollTop = 0; window.scrollTo(0, 0); return; }
    var el = document.getElementById(slug);
    if (el) el.scrollIntoView({ block: 'start', behavior: 'auto' });
  }

  /* Highlight the menu entry for whatever is on screen. */
  function observe() {
    if (spy) spy.disconnect();
    if (!('IntersectionObserver' in window)) return;
    var visible = {};
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting; });
      var order = [].map.call(doc.querySelectorAll('.anchor'), function (a) { return a.id; });
      for (var i = 0; i < order.length; i++) {
        if (visible[order[i]]) { mark(order[i]); break; }
      }
    }, { rootMargin: '-72px 0px -70% 0px' });
    [].forEach.call(doc.querySelectorAll('.anchor'), function (a) { spy.observe(a); });
  }

  q.addEventListener('input', function () { render(this.value); });
  window.addEventListener('hashchange', route);
})();
</script>
</body>
</html>
